apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-jtsr-04-11-2026
  labels:
    app: shop-jtsr-04-11-2026
    nom: jonathan
    projet: e5
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shop-jtsr-04-11-2026
  template:
    metadata:
      labels:
        app: shop-jtsr-04-11-2026
        nom: jonathan
        projet: e5
    spec:
      containers:
      - name: shop-jtsr-04-11-2026
        image: jonathan57/shop-jtsr-04-11-2026:v1
        ports:
        - containerPort: 4242
        envFrom:
        - configMapRef:
            name: config-jtsr-04-11-2026
        - secretRef:
            name: stripe-secret-jtsr-04-11-2026
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop-jtsr-04-11-2026
  labels:
    nom: jonathan
    projet: e5
spec:
  type: NodePort
  selector:
    app: shop-jtsr-04-11-2026
  ports:
  - port: 80
    targetPort: 4242
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-jtsr-04-11-2026
  labels:
    nom: jonathan
    projet: e5
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-jtsr-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
